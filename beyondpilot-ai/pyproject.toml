[project]
name = "beyondpilot-ai"
version = "0.1.0"
description = "BeyondPilot AI service: shared core (contracts, registry, settings, errors, resilience, diagnostics, safety, validator, renderer) and HTTP layer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.55",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real safety backends. Without them the core falls back to regex heuristics.
safety = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "llm-guard>=0.3",
]
# PDF and PPTX output for the renderer. HTML works without them.
render = [
    "weasyprint>=62",
    "python-pptx>=1.0",
]
# Module B backends: Valkey cache, PostgreSQL + pgvector store.
rag = [
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]
# Module D: PDF text and page rendering for OCR.
documents = [
    "pypdfium2>=4.30",
    "pillow>=10.0",
]
# Module E: image checks.
vision = [
    "pillow>=10.0",
]
# Modules A and F: DuckDB facts, LightGBM, MLflow, OR-Tools.
ml = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "mlflow>=2.14",
    "ortools>=9.10",
]
# Module A: Snowflake source.
snowflake = [
    "snowflake-connector-python>=3.10",
]
# Module G: OPC UA reader.
ot = [
    "asyncua>=1.1",
]
otel = [
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with these calls as defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beyondpilot = ["templates/*.html"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
