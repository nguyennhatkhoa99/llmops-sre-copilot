# Eval harness skeleton. Runs in CI: `npx promptfoo@latest eval -c eval/promptfooconfig.yaml`.
# Gold cases live in eval/cases/*.yaml. CI should fail when the pass rate drops.
# The provider calls the running AI service; set BEYONDPILOT_URL and BEYONDPILOT_API_KEY.
description: BeyondPilot gold cases

providers:
  - id: https
    label: beyondpilot
    config:
      url: "{{ env.BEYONDPILOT_URL }}/api/v1/chat"
      method: POST
      headers:
        Content-Type: application/json
        X-API-Key: "{{ env.BEYONDPILOT_API_KEY }}"
      body:
        question: "{{question}}"
        workspace_id: "{{workspace_id}}"
      transformResponse: json.answer

tests: file://cases/*.yaml
